
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>de or het?</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    #suggestions {
        position: absolute;
        z-index: 10;
        background-color: white;
        width: 100%;
        max-height: 200px;
        overflow-y: auto;
        border-radius: 0.375rem;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        scrollbar-width: none; /* Firefox */
        }

    #suggestions::-webkit-scrollbar {
        display: none; /* Chrome/Safari */
        }

    #suggestions li.active {
        background-color: #e5e7eb;
        text-decoration: underline;
        }

    .result-de {
        color: #2CB3F2;
        }

    .result-het {
        color: #F26B2C;
        }

    #easterEggHeart {
        color: #f43f5e;
        font-size: 7rem;
        left: 50%;
        opacity: 0;
        pointer-events: none;
        position: fixed;
        top: 50%;
        transform: translate(-50%, -50%) scale(0);
        z-index: 20;
        }

    #easterEggHeart.show {
        animation: heart-pop 1.4s ease-out forwards;
        }

    @keyframes heart-pop {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(0); }
        25% { opacity: 1; transform: translate(-50%, -50%) scale(1.25); }
        45% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        75% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        100% { opacity: 0; transform: translate(-50%, -65%) scale(0.85); }
        }

  </style>
</head>
<body class="bg-white text-black flex items-center justify-center min-h-screen p-4 overflow-hidden max-h-screen">
  <div id="easterEggHeart" aria-hidden="true">♥</div>
  <div class="text-center w-full max-w-md relative">
    <h1 id="title" class="text-6xl font-bold italic mb-8 leading-snug">
      de or het?
    </h1>

    <div class="relative">
      <input 
        type="text" 
        id="wordInput" 
        placeholder="type your word here" 
        class="w-full p-3 border rounded bg-gray-100 italic placeholder-gray-500 focus:outline-none focus:ring-0"
        disabled
      />
      <ul id="suggestions" class="text-left italic mt-1 hidden"></ul>
    </div>
  </div>

  <script>
    let dictionary = {};
    let currentMatches = [];
    let activeSuggestionIndex = -1;
    let heartTimer;

    fetch('dictionary.json?v=kaikki-20260820')
      .then(res => res.json())
      .then(data => {
        dictionary = data;
        document.getElementById('wordInput').disabled = false;
        document.getElementById('wordInput').addEventListener('input', searchWord);
        document.getElementById('wordInput').addEventListener('keydown', function(e) {
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          if (currentMatches.length === 0) return;
          e.preventDefault();
          const direction = e.key === 'ArrowDown' ? 1 : -1;
          const nextIndex = activeSuggestionIndex === -1
            ? (direction === 1 ? 0 : currentMatches.length - 1)
            : (activeSuggestionIndex + direction + currentMatches.length) % currentMatches.length;
          setActiveSuggestion(nextIndex);
          return;
        }

        if (e.key === 'Enter') {
          e.preventDefault();
          const input = document.getElementById('wordInput');
          const value = activeSuggestionIndex >= 0
            ? currentMatches[activeSuggestionIndex]
            : input.value.toLowerCase();
          input.value = value;
          if (value === 'meryxi') {
            triggerHeart();
          } else if (dictionary[value]) {
            showResult(value);
          } else {
            if (navigator.vibrate) navigator.vibrate(100);
            title.innerHTML = 'de or het?';
          }
          clearSuggestions();
        }
      });
      })
      .catch(err => {
        console.error("Failed to load dictionary:", err);
      });

    const suggestions = document.getElementById('suggestions');
    const title = document.getElementById('title');
    const easterEggHeart = document.getElementById('easterEggHeart');

    function searchWord() {
      const input = document.getElementById('wordInput');
      const value = input.value.toLowerCase();
      clearSuggestions();
      if (navigator.vibrate) navigator.vibrate(100);
      title.innerHTML = 'de or het?';

      if (!value || value.length < 3) return;

      currentMatches = Object.keys(dictionary).filter(word => word.startsWith(value));
      if (value === 'meryxi' && !currentMatches.includes('meryxi')) {
        currentMatches.unshift('meryxi');
      }
      if (currentMatches.length > 0) {
        suggestions.classList.remove('hidden');
      }

      currentMatches.forEach((match, index) => {
        const li = document.createElement('li');
        li.textContent = match;
        li.className = 'cursor-pointer hover:underline px-3 py-1';
        li.onclick = () => {
          chooseSuggestion(match);
        };
        li.onmouseenter = () => setActiveSuggestion(index);
        suggestions.appendChild(li);
      });

      // do not show result while typing
    }

    function setActiveSuggestion(index) {
      const items = suggestions.querySelectorAll('li');
      items.forEach(item => item.classList.remove('active'));
      activeSuggestionIndex = index;
      const activeItem = items[index];
      if (activeItem) {
        activeItem.classList.add('active');
        activeItem.scrollIntoView({ block: 'nearest' });
      }
    }

    function chooseSuggestion(word) {
      document.getElementById('wordInput').value = word;
      if (word === 'meryxi') triggerHeart();
      else showResult(word);
      clearSuggestions();
    }

    function triggerHeart() {
      title.innerHTML = 'de or het?';
      clearTimeout(heartTimer);
      easterEggHeart.classList.remove('show');
      void easterEggHeart.offsetWidth;
      easterEggHeart.classList.add('show');
      heartTimer = setTimeout(() => easterEggHeart.classList.remove('show'), 1400);
    }

    function clearSuggestions() {
      suggestions.innerHTML = '';
      suggestions.classList.add('hidden');
      currentMatches = [];
      activeSuggestionIndex = -1;
    }

    function showResult(word) {
      const article = dictionary[word];
      if (article === 'both') {
        title.innerHTML = `<span class="underline result-de">de</span> or <span class="underline result-het">het</span>?`;
      } else if (article === 'het') {
        title.innerHTML = `de or <span class="underline result-het">het</span>?`;
      } else {
        title.innerHTML = `<span class="underline result-de">de</span> or het?`;
      }
    }
  </script>

  <footer class="absolute bottom-2 w-full text-center italic text-sm text-gray-500">
    A MeryXian Development (1/1) [v1.1]
  </footer>
</body>
</html>
